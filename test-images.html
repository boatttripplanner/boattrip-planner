<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Amazon Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .image-test {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .image-test img {
            max-width: 300px;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error {
            color: red;
            background: #ffe6e6;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            color: green;
            background: #e6ffe6;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Test de Imágenes de Amazon</h1>
    
    <div class="image-test">
        <h3>Test 1: URL Genérica de Amazon</h3>
        <img src="https://m.media-amazon.com/images/I/71QKQ8JQZJL._AC_SL1500_.jpg" 
             alt="Test Amazon Image" 
             onload="this.parentElement.innerHTML += '<div class=success>✅ Imagen cargada correctamente</div>'"
             onerror="this.parentElement.innerHTML += '<div class=error>❌ Error al cargar la imagen</div>'">
    </div>

    <div class="image-test">
        <h3>Test 2: URL de Producto Náutico</h3>
        <img src="https://m.media-amazon.com/images/I/71QKQ8JQZJL._AC_SL1500_.jpg" 
             alt="Producto Náutico" 
             onload="this.parentElement.innerHTML += '<div class=success>✅ Imagen cargada correctamente</div>'"
             onerror="this.parentElement.innerHTML += '<div class=error>❌ Error al cargar la imagen</div>'">
    </div>

    <div class="image-test">
        <h3>Test 3: URL de Placeholder</h3>
        <img src="/images/products/default-product.svg" 
             alt="Placeholder" 
             onload="this.parentElement.innerHTML += '<div class=success>✅ Imagen cargada correctamente</div>'"
             onerror="this.parentElement.innerHTML += '<div class=error>❌ Error al cargar la imagen</div>'">
    </div>

    <script>
        // Test adicional con JavaScript
        console.log('Testing Amazon image URLs...');
        
        const testUrls = [
            'https://m.media-amazon.com/images/I/71QKQ8JQZJL._AC_SL1500_.jpg',
            'https://m.media-amazon.com/images/I/71QKQ8JQZJL._AC_SL1500_.jpg',
            'https://m.media-amazon.com/images/I/71QKQ8JQZJL._AC_SL1500_.jpg'
        ];

        testUrls.forEach((url, index) => {
            const img = new Image();
            img.onload = () => console.log(`✅ URL ${index + 1} funciona:`, url);
            img.onerror = () => console.log(`❌ URL ${index + 1} falla:`, url);
            img.src = url;
        });
    </script>
</body>
</html>
