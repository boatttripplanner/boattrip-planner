<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - BoatTrip Planner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d9488 0%, #0891b2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .offline-container {
      text-align: center;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 3rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      opacity: 0.9;
      line-height: 1.6;
    }
    
    .retry-button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 1rem 2rem;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    
    .retry-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    .features {
      margin-top: 2rem;
      text-align: left;
    }
    
    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    .feature-icon {
      margin-right: 0.5rem;
      font-size: 1.2rem;
    }
    
    @media (max-width: 768px) {
      .offline-container {
        padding: 2rem 1rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Sin Conexión</h1>
    <p>
      Parece que has perdido la conexión a internet. 
      No te preocupes, puedes seguir usando algunas funciones de BoatTrip Planner.
    </p>
    
    <div class="features">
      <div class="feature">
        <span class="feature-icon">✅</span>
        Ver contenido previamente cargado
      </div>
      <div class="feature">
        <span class="feature-icon">✅</span>
        Acceder a tu historial de viajes
      </div>
      <div class="feature">
        <span class="feature-icon">✅</span>
        Revisar recomendaciones guardadas
      </div>
    </div>
    
    <button class="retry-button" onclick="window.location.reload()">
      Reintentar Conexión
    </button>
  </div>
  
  <script>
    // Verificar conexión periódicamente
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
    
    // Escuchar cambios de conectividad
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
