<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado del mar -->
  <defs>
    <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cielo -->
  <rect width="800" height="200" fill="url(#skyGradient)"/>
  
  <!-- Mar -->
  <rect x="0" y="200" width="800" height="200" fill="url(#seaGradient)"/>
  
  <!-- Islas -->
  <ellipse cx="150" cy="220" rx="80" ry="40" fill="#fbbf24" opacity="0.8"/>
  <ellipse cx="350" cy="210" rx="60" ry="30" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="550" cy="230" rx="70" ry="35" fill="#d97706" opacity="0.8"/>
  <ellipse cx="700" cy="215" rx="50" ry="25" fill="#92400e" opacity="0.9"/>
  
  <!-- Palmeras en las islas -->
  <g transform="translate(150, 180)">
    <ellipse cx="0" cy="0" rx="15" ry="25" fill="#059669"/>
    <ellipse cx="-10" cy="-5" rx="12" ry="20" fill="#047857"/>
    <ellipse cx="10" cy="-5" rx="12" ry="20" fill="#065f46"/>
  </g>
  
  <g transform="translate(350, 170)">
    <ellipse cx="0" cy="0" rx="12" ry="20" fill="#059669"/>
    <ellipse cx="-8" cy="-3" rx="10" ry="15" fill="#047857"/>
    <ellipse cx="8" cy="-3" rx="10" ry="15" fill="#065f46"/>
  </g>
  
  <!-- Barcos -->
  <g transform="translate(250, 280)">
    <!-- Velero -->
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-30 0,0 -15,0" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-25 0,0 15,0" fill="#ffffff" opacity="0.9"/>
    <line x1="0" y1="-30" x2="0" y2="0" stroke="#374151" stroke-width="2"/>
  </g>
  
  <g transform="translate(450, 290)">
    <!-- Lancha -->
    <ellipse cx="0" cy="0" rx="20" ry="6" fill="#ef4444" opacity="0.9"/>
    <rect x="-15" y="-8" width="30" height="8" fill="#dc2626" opacity="0.9"/>
  </g>
  
  <g transform="translate(650, 285)">
    <!-- Catamarán -->
    <ellipse cx="-15" cy="0" rx="12" ry="5" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="15" cy="0" rx="12" ry="5" fill="#ffffff" opacity="0.9"/>
    <rect x="-5" y="-15" width="10" height="15" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Olas -->
  <path d="M 0 380 Q 100 360 200 380 Q 300 400 400 380 Q 500 360 600 380 Q 700 400 800 380 L 800 400 L 0 400 Z" fill="#1e40af" opacity="0.6"/>
  <path d="M 0 390 Q 100 370 200 390 Q 300 410 400 390 Q 500 370 600 390 Q 700 410 800 390 L 800 400 L 0 400 Z" fill="#1e3a8a" opacity="0.4"/>
  
  <!-- Nubes -->
  <ellipse cx="100" cy="80" rx="30" ry="15" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="130" cy="80" rx="25" ry="12" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="160" cy="80" rx="20" ry="10" fill="#ffffff" opacity="0.8"/>
  
  <ellipse cx="600" cy="60" rx="25" ry="12" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="625" cy="60" rx="20" ry="10" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="650" cy="60" rx="15" ry="8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Sol -->
  <circle cx="700" cy="50" r="25" fill="#fbbf24"/>
  <g stroke="#f59e0b" stroke-width="3">
    <line x1="700" y1="15" x2="700" y2="25"/>
    <line x1="700" y1="75" x2="700" y2="85"/>
    <line x1="675" y1="25" x2="685" y2="35"/>
    <line x1="715" y1="65" x2="725" y2="75"/>
    <line x1="675" y1="65" x2="685" y2="75"/>
    <line x1="715" y1="25" x2="725" y2="35"/>
  </g>
</svg> 