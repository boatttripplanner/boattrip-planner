<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Fondo principal -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Ondas decorativas -->
  <path d="M0,500 Q300,450 600,500 T1200,500 L1200,630 L0,630 Z" fill="url(#waveGradient)"/>
  <path d="M0,520 Q400,470 800,520 T1200,520 L1200,630 L0,630 Z" fill="url(#waveGradient)" opacity="0.5"/>
  
  <!-- Barco estilizado -->
  <g transform="translate(200, 300)">
    <!-- Casco del barco -->
    <path d="M0,50 Q50,30 100,50 L120,80 L-20,80 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Mástil -->
    <rect x="45" y="-80" width="10" height="130" fill="#ffffff" opacity="0.8"/>
    
    <!-- Vela -->
    <path d="M50,-80 L50,-20 Q80,-40 50,-60 Z" fill="#ffffff" opacity="0.7"/>
    
    <!-- Bandera -->
    <rect x="55" y="-90" width="20" height="12" fill="#0d9488"/>
  </g>
  
  <!-- Icono de IA -->
  <g transform="translate(900, 200)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" opacity="0.2"/>
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.4"/>
    
    <!-- Puntos de conexión -->
    <circle cx="-15" cy="-15" r="3" fill="#ffffff"/>
    <circle cx="15" cy="-15" r="3" fill="#ffffff"/>
    <circle cx="0" cy="15" r="3" fill="#ffffff"/>
    <circle cx="-15" cy="15" r="3" fill="#ffffff"/>
    <circle cx="15" cy="15" r="3" fill="#ffffff"/>
    
    <!-- Líneas de conexión -->
    <line x1="-15" y1="-15" x2="15" y2="-15" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Título principal -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    BoatTrip Planner
  </text>
  
  <!-- Subtítulo -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" opacity="0.9">
    Planificador de Viajes Náuticos con IA
  </text>
  
  <!-- Descripción -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" opacity="0.8">
    Recomendaciones personalizadas • Itinerarios náuticos • Consejos expertos
  </text>
  
  <!-- Elementos decorativos adicionales -->
  <g opacity="0.3">
    <!-- Pequeños barcos -->
    <g transform="translate(100, 450)">
      <path d="M0,20 Q10,10 20,20 L25,30 L-5,30 Z" fill="#ffffff"/>
      <rect x="8" y="-15" width="4" height="35" fill="#ffffff"/>
    </g>
    
    <g transform="translate(1100, 480)">
      <path d="M0,15 Q8,8 15,15 L18,22 L-3,22 Z" fill="#ffffff"/>
      <rect x="6" y="-10" width="3" height="25" fill="#ffffff"/>
    </g>
  </g>
</svg> 