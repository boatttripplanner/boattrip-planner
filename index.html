    <!-- 🚨 SAFARI COMPATIBILITY FIXES -->
    <script>
      // Safari-specific fixes
      if (navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) {
        // Fix for Safari viewport issues
        document.addEventListener('DOMContentLoaded', function() {
          // Force viewport recalculation
          setTimeout(function() {
            const viewport = document.querySelector('meta[name=viewport]');
            if (viewport) {
              viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
            }
          }, 100);
        });
        
        // Fix for Safari touch events
        document.addEventListener('touchstart', function() {}, {passive: true});
        document.addEventListener('touchmove', function() {}, {passive: true});
      }
      
      // Chrome mobile fixes
      if (navigator.userAgent.includes('Chrome') && /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        // Fix for Chrome mobile viewport
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            const viewport = document.querySelector('meta[name=viewport]');
            if (viewport) {
              viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes');
            }
          }, 100);
        });
      }
      
      // iOS Safari specific fixes
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        document.addEventListener('DOMContentLoaded', function() {
          // Fix for iOS Safari 100vh issue
          const setVH = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
          };
          
          setVH();
          window.addEventListener('resize', setVH);
          window.addEventListener('orientationchange', setVH);
        });
      }
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      // Enhanced Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            // Ensure we're on the correct domain
            const currentOrigin = window.location.origin;
            const swUrl = `${currentOrigin}/sw.js`;
            
            console.log('🔧 Registering Service Worker from:', swUrl);
            
            const registration = await navigator.serviceWorker.register(swUrl, { 
              scope: '.',
              updateViaCache: 'none'
            });
            console.log('✅ Service Worker registered successfully:', registration);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              console.log('🔄 Service Worker update found');
            });
            
            // Handle updates
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              console.log('🔄 Service Worker controller changed');
            });
            
          } catch (registrationError) {
            console.error('❌ Service Worker registration failed:', registrationError);
            
            // Fallback: try without scope
            try {
              console.log('🔄 Trying fallback registration...');
              const fallbackRegistration = await navigator.serviceWorker.register('/sw.js');
              console.log('✅ Fallback Service Worker registered:', fallbackRegistration);
            } catch (fallbackError) {
              console.error('❌ Fallback registration also failed:', fallbackError);
            }
          }
        });
      } else {
        console.warn('⚠️ Service Worker not supported');
      }
      
      // Performance monitoring
      window.addEventListener('load', () => {
        if ('performance' in window) {
          const perfData = performance.getEntriesByType('navigation')[0];
          if (perfData && perfData.loadEventEnd && perfData.loadEventStart) {
            console.log('📊 Page Load Time:', perfData.loadEventEnd - perfData.loadEventStart);
          }
        }
      });
    </script>
